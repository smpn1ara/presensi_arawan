<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scan QR - E-Presensi</title><style>* { margin:0; padding:0; box-sizing:border-box; }body { background:#0f172a; color:white; font-family:"Segoe UI",sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; gap:16px; }h2 { font-size:15px; font-weight:700; color:#e2e8f0; letter-spacing:1px; }#videoWrap { position:relative; width:100%; max-width:420px; }video { width:100%; border-radius:16px; display:block; background:#000; min-height:240px; }canvas { display:none; }.overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }.box { width:200px; height:200px; position:relative; }.corner { position:absolute; width:24px; height:24px; border-color:#6366f1; border-style:solid; }.tl { top:0; left:0; border-width:4px 0 0 4px; border-radius:6px 0 0 0; }.tr { top:0; right:0; border-width:4px 4px 0 0; border-radius:0 6px 0 0; }.bl { bottom:0; left:0; border-width:0 0 4px 4px; border-radius:0 0 0 6px; }.br { bottom:0; right:0; border-width:0 4px 4px 0; border-radius:0 0 6px 0; }.scanline { position:absolute; left:6px; right:6px; height:2px; background:linear-gradient(90deg,transparent,#6366f1,transparent); top:10px; animation:scan 2s linear infinite; }@keyframes scan { 0%{top:10px;opacity:1} 100%{top:190px;opacity:0} }#status { font-size:13px; color:#94a3b8; text-align:center; max-width:340px; min-height:40px; line-height:1.6; padding:0 10px; }#status.ok { color:#4ade80; font-weight:700; font-size:16px; }#status.err { color:#f87171; }.btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; max-width:420px; }button { flex:1; min-width:110px; background:#4f46e5; color:white; border:none; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; transition:background .2s; }button:hover { background:#4338ca; }button.sec { background:#1e293b; border:1px solid #334155; }button.sec:hover { background:#334155; }#loading { color:#64748b; font-size:13px; text-align:center; }.spinner { width:36px; height:36px; border:3px solid #1e293b; border-top:3px solid #6366f1; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }@keyframes spin { to { transform:rotate(360deg); } }</style></head><body><h2>&#128247; SCAN QR PRESENSI</h2><div id="loading"><div class="spinner"></div>Memulai kamera...</div><div id="videoWrap" style="display:none">  <video id="video" autoplay playsinline muted></video>  <canvas id="canvas"></canvas>  <div class="overlay"><div class="box">    <div class="corner tl"></div><div class="corner tr"></div>    <div class="corner bl"></div><div class="corner br"></div>    <div class="scanline"></div>  </div></div></div><div id="status">Arahkan QR code ke dalam kotak</div><div class="btns">  <button onclick="switchCam()">&#128260; Ganti Kamera</button>  <button class="sec" onclick="window.close()">&#10005; Tutup</button></div><script>var stream=null,facing="environment",loopId=null,lastScan=0;var video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");var status=document.getElementById("status"),loading=document.getElementById("loading"),wrap=document.getElementById("videoWrap");var LS_KEY="gas_qr_result";async function startCam(f){  try{    if(stream)stream.getTracks().forEach(function(t){t.stop();});    if(loopId){cancelAnimationFrame(loopId);clearInterval(loopId);loopId=null;}    loading.style.display="block";wrap.style.display="none";    status.className="";status.textContent="Memulai kamera...";    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f==="environment"?{ideal:"environment"}:"user",width:{ideal:1280},height:{ideal:720}}});    video.srcObject=stream;    await new Promise(function(res){video.onloadedmetadata=function(){video.play();res();};});    loading.style.display="none";wrap.style.display="block";    status.textContent="Arahkan QR code ke dalam kotak";    beginScan();  }catch(e){    loading.style.display="none";status.className="err";    status.innerHTML="Kamera gagal: "+e.name+"<br><small>"+e.message+"</small>";  }}function switchCam(){facing=facing==="environment"?"user":"environment";startCam(facing);}function beginScan(){  if("BarcodeDetector" in window){    var detector=new BarcodeDetector({formats:["qr_code"]});    var loop=async function(){      if(video.readyState===video.HAVE_ENOUGH_DATA){        canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);        try{var codes=await detector.detect(canvas);if(codes.length>0){var now=Date.now();if(now-lastScan>3000){lastScan=now;handleResult(codes[0].rawValue);}}}catch(e){}      }      loopId=requestAnimationFrame(loop);    };    loopId=requestAnimationFrame(loop);  }else{    var s=document.createElement("script");    s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";    s.onload=function(){      loopId=setInterval(function(){        if(video.readyState!==video.HAVE_ENOUGH_DATA)return;        canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);        var d=ctx.getImageData(0,0,canvas.width,canvas.height);        var c=jsQR(d.data,d.width,d.height);        if(c&&c.data){var now=Date.now();if(now-lastScan>3000){lastScan=now;handleResult(c.data);}}      },400);    };    document.head.appendChild(s);  }}function handleResult(text){  if(!text)return;  if(loopId){cancelAnimationFrame(loopId);clearInterval(loopId);loopId=null;}  if(stream)stream.getTracks().forEach(function(t){t.stop();});  status.className="ok";status.textContent="QR Terdeteksi! Menyimpan...";  try{    localStorage.setItem(LS_KEY,JSON.stringify({nis:text,ts:Date.now()}));    status.textContent="Berhasil! Menutup tab...";  }catch(e){status.className="err";status.textContent="Gagal simpan: "+e.message;}  setTimeout(function(){window.close();},1500);}startCam(facing);</script></body></html>
